<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/">
  <title>Giriş Yap & Kayıt Ol - Pazurka</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/favicon.png">
  <link rel="shortcut icon" href="favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#FD4800', hover: '#E03E00', light: '#FFF2EB', dark: '#0F1114' }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/main.css">
</head>

<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen">

  <header class="bg-white border-b border-slate-200/80 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-20">
        <a href="/" class="flex-shrink-0 flex items-center">
          <img src="images/pazurkalogo.png"
            onerror="this.onerror=null; this.src='pazurkalogo.png'; if(!this.complete) this.src='/images/pazurkalogo.png';"
            alt="Pazurka Logo" class="h-10 sm:h-12 w-auto object-contain">
        </a>
        <a href="/" class="text-xs font-bold text-slate-500 hover:text-brand flex items-center gap-1">
          <i data-lucide="arrow-left" class="w-4 h-4"></i> Ana Sayfa
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 py-12 flex-1 w-full space-y-6">
    <div class="bg-white rounded-3xl p-8 border border-slate-100 shadow-sm space-y-6">

      <div class="grid grid-cols-2 p-1 bg-slate-100 rounded-2xl text-xs font-bold">
        <button onclick="switchAuthTab('login')" id="auth-tab-login"
          class="py-2.5 rounded-xl bg-white text-slate-900 shadow-sm transition">Giriş Yap</button>
        <button onclick="switchAuthTab('register')" id="auth-tab-register"
          class="py-2.5 rounded-xl text-slate-500 hover:text-slate-900 transition">Kayıt Ol</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">E-Posta Adresi</label>
          <input type="email" id="login-email" required placeholder="demo@pazurka.com"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Şifre</label>
          <input type="password" id="login-pass" required placeholder="••••••••"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand">
        </div>

        <button type="submit"
          class="w-full py-3.5 bg-brand hover:bg-brand-hover text-white font-bold rounded-2xl transition shadow-md btn-glow text-sm">
          Giriş Yap
        </button>
      </form>

      <!-- Register Form -->
      <form id="register-form" onsubmit="handleRegister(event)" class="hidden space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Adınız Soyadınız *</label>
          <input type="text" id="reg-name" required placeholder="Can Yılmaz"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">E-Posta Adresi *</label>
          <input type="email" id="reg-email" required placeholder="can@example.com"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Telefon
            (Opsiyonel)</label>
          <input type="tel" id="reg-phone" placeholder="0532 000 00 00"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Şehir (İl)</label>
            <select id="reg-city"
              class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand cursor-pointer">
              <option value="">İl Seçiniz...</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">İlçe</label>
            <select id="reg-district"
              class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand cursor-pointer disabled:bg-slate-100 disabled:cursor-not-allowed">
              <option value="">Önce İl Seçiniz...</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Teslimat Adresi
            (Opsiyonel)</label>
          <textarea id="reg-address" rows="2"
            placeholder="Mahalle, Cadde, Sokak, Kapı No... (Dilerseniz sonra Hesabım'dan da ekleyebilirsiniz)"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand"></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Şifre *</label>
          <input type="password" id="reg-pass" required minlength="6" placeholder="En az 6 karakter"
            class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand">
        </div>

        <button type="submit"
          class="w-full py-3.5 bg-brand hover:bg-brand-hover text-white font-bold rounded-2xl transition shadow-md btn-glow text-sm">
          Hesap Oluştur
        </button>
      </form>

      <!-- Quick Demo Login Fast Buttons -->
      <div class="pt-4 border-t border-slate-100 space-y-2">
        <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider text-center">Hızlı Test / Demo Girişi
        </p>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="fillDemo('customer')"
            class="py-2 px-3 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-semibold text-slate-700 text-center transition">
            Demo Müşteri
          </button>
          <button type="button" onclick="fillDemo('admin')"
            class="py-2 px-3 bg-orange-50 hover:bg-orange-100 text-brand rounded-xl text-xs font-bold text-center transition">
            Yönetici (Admin)
          </button>
        </div>
      </div>

    </div>
  </main>

  <footer class="mt-auto bg-brand-dark text-slate-400 text-xs py-8 border-t border-white/10 text-center">
    <div class="max-w-7xl mx-auto px-4">
      <p>© 2026 Pazurka E-Ticaret Platformu.</p>
    </div>
  </footer>

  <script src="js/store.js"></script>
  <script>
    function switchAuthTab(t) {
      if (t === 'login') {
        document.getElementById("auth-tab-login").className = "py-2.5 rounded-xl bg-white text-slate-900 shadow-sm transition";
        document.getElementById("auth-tab-register").className = "py-2.5 rounded-xl text-slate-500 hover:text-slate-900 transition";
        document.getElementById("login-form").classList.remove("hidden");
        document.getElementById("register-form").classList.add("hidden");
      } else {
        document.getElementById("auth-tab-register").className = "py-2.5 rounded-xl bg-white text-slate-900 shadow-sm transition";
        document.getElementById("auth-tab-login").className = "py-2.5 rounded-xl text-slate-500 hover:text-slate-900 transition";
        document.getElementById("register-form").classList.remove("hidden");
        document.getElementById("login-form").classList.add("hidden");
      }
    }

    function fillDemo(type) {
      switchAuthTab('login');
      if (type === 'admin') {
        document.getElementById("login-email").value = "admin@pazurka.com";
        document.getElementById("login-pass").value = "admin123";
      } else {
        document.getElementById("login-email").value = "demo@pazurka.com";
        document.getElementById("login-pass").value = "pazurka123";
      }
      Pazurka.toast("Demo bilgileri dolduruldu! 'Giriş Yap' butonuna basabilirsiniz.", "info");
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-pass").value;

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success && data.user) {
          Pazurka.setUser(data.user, data.token);
          Pazurka.toast(data.message || "Giriş yapıldı!", "success");
          setTimeout(() => {
            window.location.href = data.user.role === 'admin' ? "/admin" : "/hesabim";
          }, 600);
          return;
        }
      } catch (err) { }

      // Fallback offline login simulation
      if (email === "admin@pazurka.com") {
        Pazurka.setUser({ id: 1, email, full_name: "Pazurka Yönetici", role: "admin" }, "token");
        Pazurka.toast("Yönetici girişi başarılı!", "success");
        setTimeout(() => window.location.href = "/admin", 500);
      } else {
        Pazurka.setUser({ id: 2, email, full_name: "Ahmet Yılmaz", role: "customer" }, "token");
        Pazurka.toast("Müşteri girişi başarılı!", "success");
        setTimeout(() => window.location.href = "/hesabim", 500);
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const full_name = document.getElementById("reg-name").value.trim();
      const email = document.getElementById("reg-email").value.trim();
      const phone = document.getElementById("reg-phone").value.trim();
      const city = document.getElementById("reg-city").value.trim();
      const district = document.getElementById("reg-district").value.trim();
      const address = document.getElementById("reg-address").value.trim();
      const password = document.getElementById("reg-pass").value;

      try {
        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ full_name, email, phone, password })
        });
        const data = await res.json();
        if (data.success && data.user) {
          const userObj = { ...data.user, phone, city, district, address };
          Pazurka.setUser(userObj, data.token);

          // If address was provided, save it as default address
          if (address && city) {
            await Pazurka.saveAddress({
              title: "Ev Adresim",
              recipient_name: full_name,
              phone: phone,
              city: city,
              district: district,
              address_line: address,
              is_default: 1
            });
          }

          Pazurka.toast("Kaydınız başarıyla oluşturuldu!", "success");
          setTimeout(() => window.location.href = "/hesabim", 600);
          return;
        }
      } catch (err) { }

      // Fallback offline simulation
      const userObj = { id: Date.now(), email, full_name, phone, city, district, address, role: "customer" };
      Pazurka.setUser(userObj, "token");
      if (address && city) {
        await Pazurka.saveAddress({
          title: "Ev Adresim",
          recipient_name: full_name,
          phone: phone,
          city: city,
          district: district,
          address_line: address,
          is_default: 1
        });
      }
      Pazurka.toast("Hesabınız oluşturuldu!", "success");
      setTimeout(() => window.location.href = "/hesabim", 500);
    }

    document.addEventListener("DOMContentLoaded", () => {
      Pazurka.populateCityDistrict("reg-city", "reg-district");
    });
  </script>
</body>

</html>

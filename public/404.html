<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/">
  <title>Sayfa Bulunamadı - Pazarvadi</title>
  <link rel="icon" type="image/png" href="images/favicon.png?v=3">
  <link rel="apple-touch-icon" href="images/favicon.png?v=3">
  <link rel="shortcut icon" href="favicon.ico?v=3">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#FD4800', hover: '#E03E00', light: '#FFF2EB', dark: '#0F1114' }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen items-center justify-center p-4">
  <div class="max-w-md w-full text-center space-y-6 bg-white p-8 sm:p-12 rounded-3xl border border-slate-100 shadow-sm">
    <img src="/images/pazarvadilogo.png?v=3" alt="Pazarvadi Logo" class="h-10 mx-auto object-contain">
    <div class="space-y-2">
      <h1 class="text-6xl font-extrabold text-brand font-mono">404</h1>
      <h2 class="text-xl font-bold text-slate-900">Aradığınız Sayfa Bulunamadı</h2>
      <p class="text-xs text-slate-500">Ulaşmaya çalıştığınız sayfa taşınmış veya silinmiş olabilir.</p>
    </div>
    <a href="/" class="inline-flex items-center gap-2 px-6 py-3 bg-brand hover:bg-brand-hover text-white text-xs font-bold rounded-xl transition shadow-md btn-glow">
      <i data-lucide="home" class="w-4 h-4"></i>
      <span>Ana Sayfaya Dön</span>
    </a>
  </div>
  <script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
